name: Generated code

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  generate:
    name: Protobuf code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Install buf and the plugins
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.73.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.21.0
      - run: buf generate
      - name: No changes
        run: git diff --exit-code -- gen
