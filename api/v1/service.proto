syntax = "proto3";

import "google/protobuf/empty.proto";

package api.v1;

option go_package = "github.com/Perruer/sapper/gen/api/v1;apiv1";

message QueryRequest {
  string script = 1;
}

message QueryResponse {
  repeated Node nodes = 1;
}

message AllKeysResponse {
  repeated Node nodes = 1;
}

message Node {
  uint32 id = 1;
  string name = 2;
  string type = 3;
  repeated uint32 dependencies = 4;
  repeated uint32 dependents = 5;
  bytes  metadata = 6;
}

message Query {
  Node node = 1;
  repeated uint32 output = 2;
}

message CustomLeaderboardRequest {
  string script = 1;
}

message CustomLeaderboardResponse {
  repeated Query queries = 1;
}

message GetNodeRequest {
  uint32 id = 1;
}

message GetNodeResponse {
  Node node = 1;
}

message GetNodeByNameRequest {
  string name = 1;
}

message GetNodeByNameResponse {
  Node node = 1;
}

message GetNodesByGlobRequest {
  string pattern = 1;
}

message GetNodesByGlobResponse {
  repeated Node nodes = 1;
}

message AddNodeRequest {
  Node node = 1;
}

message AddNodeResponse {
  Node node = 1;
}

message SetDependencyRequest {
  uint32 nodeId = 1;
  uint32 dependencyID = 2;
}

message IngestSBOMRequest {
  bytes sbom = 1;
}

message IngestVulnerabilityRequest {
  bytes vulnerability = 1;
}

message IngestScorecardRequest {
  bytes scorecard = 1;
}

// A CISA KEV catalog (JSON), a daily EPSS file (CSV, may be gzipped) or an OpenVEX document.
message IngestDataRequest {
  bytes data = 1;
}

message IngestDataResponse {
  // How many entries were stored.
  int64 count = 1;
}

message ReportRequest {
  // One vulnerability by OSV ID or alias (for example a CVE); empty for all of them.
  string vulnerability = 1;
  // Only vulnerabilities in the CISA KEV catalog.
  bool kev_only = 2;
  // Only vulnerabilities with at least this EPSS score.
  double min_epss = 3;
}

message KEVEntry {
  string cve_id = 1;
  string vendor_project = 2;
  string product = 3;
  string vulnerability_name = 4;
  string date_added = 5;
  string short_description = 6;
  string required_action = 7;
  string due_date = 8;
  string known_ransomware_campaign_use = 9;
}

message EPSSScore {
  double epss = 1;
  double percentile = 2;
  string date = 3;
}

message VEXStatement {
  string status = 1;
  string justification = 2;
  string impact_statement = 3;
  string action_statement = 4;
  string timestamp = 5;
}

message ProductImpact {
  string name = 1;
  // From the product to the vulnerable package, both included.
  repeated string path = 2;
  VEXStatement vex = 3;
}

message Finding {
  string id = 1;
  repeated string aliases = 2;
  string summary = 3;
  string severity = 4;
  KEVEntry kev = 5;
  EPSSScore epss = 6;
  repeated string packages = 7;
  repeated ProductImpact products = 8;
  // Products that a VEX statement marks not_affected or fixed.
  repeated ProductImpact suppressed = 9;
}

message ReportResponse {
  repeated Finding findings = 1;
}

message HealthCheckResponse {
  string status = 1;
}

service QueryService {
  rpc Query(QueryRequest) returns (QueryResponse) {}
}

service CacheService {
  rpc Cache(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc Clear(google.protobuf.Empty) returns (google.protobuf.Empty) {}
}

service LeaderboardService {
  rpc CustomLeaderboard(CustomLeaderboardRequest) returns (CustomLeaderboardResponse) {}
  rpc AllKeys(google.protobuf.Empty) returns (AllKeysResponse) {}
}

service GraphService {
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse) {}
  rpc GetNodesByGlob(GetNodesByGlobRequest) returns (GetNodesByGlobResponse) {}
  rpc GetNodeByName(GetNodeByNameRequest) returns (GetNodeByNameResponse) {}
  rpc AddNode(AddNodeRequest) returns (AddNodeResponse) {}
  rpc SetDependency(SetDependencyRequest) returns (google.protobuf.Empty) {}
}

service IngestService {
  rpc IngestSBOM(IngestSBOMRequest) returns (google.protobuf.Empty) {}
  rpc IngestVulnerability(IngestVulnerabilityRequest) returns (google.protobuf.Empty) {}
  rpc IngestScorecard(IngestScorecardRequest) returns (google.protobuf.Empty) {}
  rpc IngestKEV(IngestDataRequest) returns (IngestDataResponse) {}
  rpc IngestEPSS(IngestDataRequest) returns (IngestDataResponse) {}
  rpc IngestVEX(IngestDataRequest) returns (IngestDataResponse) {}
}

service ReportService {
  // Vulnerabilities with the products they reach, most urgent first.
  rpc Report(ReportRequest) returns (ReportResponse) {}
}

service HealthService {
  rpc Check(google.protobuf.Empty) returns (HealthCheckResponse) {}
}